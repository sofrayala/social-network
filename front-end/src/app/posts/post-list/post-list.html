@if(isLoading){
  <mat-spinner></mat-spinner>
}@else{
  
  @if(posts().length > 0) { @for (post of posts(); track $index) {
    <mat-accordion multi="true">
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          {{ post.title }}
    </mat-expansion-panel-header>
    <div class="post-image">
    <img [src]="post.imagePath" [alt]="post.title">
    </div>
    <p>{{ post.content }}</p>
    
    <mat-action-row>
      <a matButton [routerLink]="['/edit', post.id]">EDIT</a>
      <button matButton="tonal" (click)="onDelete(post.id)" >DELETE</button>
    </mat-action-row>
  </mat-expansion-panel>
</mat-accordion>

}
<mat-paginator [length]="totalPosts" [pageSize]="postsPerPage" [pageSizeOptions]="pageSizeOptions" (page)="onChangedPage($event)"></mat-paginator>
} @else {
  <p class="info-text mat-body-1">No posts added yet.</p>
}
}
